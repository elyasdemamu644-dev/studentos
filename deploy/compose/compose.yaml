name: studentos
services:
  egress-gateway:
    init: true
    build:
      context: ../..
      dockerfile: Dockerfile
      target: egress
    restart: unless-stopped
    environment:
      EGRESS_ALLOWED_DESTINATIONS: ${EGRESS_ALLOWED_DESTINATIONS:?Set exact approved host:port destinations}
      EGRESS_DATABASE_HOST: ${EGRESS_DATABASE_HOST:?Set the Neon hostname}
      EGRESS_PROXY_PORT: "3128"
    networks:
      egress-private:
        ipv4_address: 172.30.0.2
      internet-egress: {}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3128/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    init: true
    build:
      context: ../..
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:?Set Neon TLS URL}
      EGRESS_DATABASE_HOST: ${EGRESS_DATABASE_HOST:?Set the Neon hostname}
      EGRESS_PROXY_URL: http://egress-gateway:3128
      EGRESS_ALLOWED_DESTINATIONS: ${EGRESS_ALLOWED_DESTINATIONS:?Set exact approved host:port destinations}
      JWT_SECRET: ${JWT_SECRET:?Set a generated base64url 32-byte secret}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set a separate generated base64url 32-byte secret}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set exact HTTPS web origin}
      TRUST_PROXY: "1"
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_PROVIDER: ${AI_PROVIDER:-openrouter}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CUSTOM_AI_ENDPOINT: ${CUSTOM_AI_ENDPOINT:-}
      CUSTOM_AI_API_KEY: ${CUSTOM_AI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://localhost}
      AI_ALLOW_PRIVATE_ENDPOINTS: "false"
      GOOGLE_JWKS_URI: ${GOOGLE_JWKS_URI:-https://www.googleapis.com/oauth2/v3/certs}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-studentos}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      UPLOAD_DIR: /app/uploads
    extra_hosts:
      - "${EGRESS_DATABASE_HOST:?Set the Neon hostname}=172.30.0.2"
    depends_on:
      egress-gateway:
        condition: service_healthy
    networks:
      egress-private:
        ipv4_address: 172.30.0.3
      app-private: {}
    volumes:
      - uploads:/app/uploads
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    init: true
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set public API URL, e.g. https://api.example.com}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on: [api]
    networks: [app-private]
    read_only: true
    tmpfs: [/tmp, /app/frontend/.next/cache]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  caddy:
    init: true
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?Set web hostname}
      API_DOMAIN: ${API_DOMAIN:?Set API hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]
    networks: [public-edge, app-private]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]

networks:
  # API-to-gateway traffic is private. The gateway alone also joins internet-egress.
  egress-private:
    internal: true
    ipam:
      config: [{subnet: 172.30.0.0/24}]
  # API receives requests from Caddy; Caddy initiates all connections to API.
  app-private:
    internal: true
  public-edge:
    driver: bridge
  internet-egress:
    driver: bridge

volumes:
  uploads:
  caddy_data:
  caddy_config:

