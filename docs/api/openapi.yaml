        '502':
          $ref: '#/components/responses/502'
        '503':
          $ref: '#/components/responses/503'
      description: >-
        With `generateReply: true` (default) this runs the agent: it stores your message, executes read tools, and may
        park a write as a `pendingAction` (nothing is written until you confirm). `toolActivity` describes what ran,
        `agent` how the turn finished. A missing provider answers 503 and **nothing is stored**; a provider failure
        answers 502.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAiMessageRequest'
