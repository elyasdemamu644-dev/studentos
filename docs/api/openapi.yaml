paths:
  /health:
    get:
      tags:
        - Health
      summary: Liveness and readiness probe
      operationId: getHealth
      security: []
      description: >-
        Public, and deliberately not rate limited. Returns 200 with `status: "ok"` when `SELECT 1` answers, otherwise
        503 with `status: "degraded"` — both carry the same body, which uses the success envelope rather than the error
        envelope.
      responses:
        '200':
          description: Service healthy.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/HealthData'
        '503':
          description: Service alive but the database is unreachable.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required:
                      - success
                    properties:
                      success:
                        type: boolean
                        const: false
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/HealthData'
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new account
      operationId: register
      responses:
        '201':
          description: >-
            Creates the account and returns the public profile. Passwords are hashed with Argon2id. A duplicate email
            answers 409 CONFLICT. The only password rule enforced today is non-empty.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/PublicUser'
        '400':
          $ref: '#/components/responses/400'
        '409':
          $ref: '#/components/responses/409'
        '429':
          $ref: '#/components/responses/429'
      description: >-
        Creates the account and returns the public profile. Passwords are hashed with Argon2id. A duplicate email
        answers 409 CONFLICT. The only password rule enforced today is non-empty.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      security: []
  /auth/login:
    post:
      tags:
        - Auth
      summary: Exchange credentials for tokens
      operationId: login
      responses:
        '200':
          description: >-
            Returns a new access/refresh pair plus the public profile. Bad credentials answer 401 with a deliberately
            generic message.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '429':
          $ref: '#/components/responses/429'
      description: >-
        Returns a new access/refresh pair plus the public profile. Bad credentials answer 401 with a deliberately
        generic message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security: []
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Rotate a refresh token
      operationId: refresh
      responses:
        '200':
          description: >-
            Issues a new pair and rotates the stored `RefreshToken` row. An unknown, expired or revoked row answers 401
            even if the JWT itself would still verify.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '429':
          $ref: '#/components/responses/429'
      description: >-
        Issues a new pair and rotates the stored `RefreshToken` row. An unknown, expired or revoked row answers 401 even
        if the JWT itself would still verify.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      security: []
  /auth/logout:
    post:
      tags:
        - Auth
      summary: Revoke a refresh token
      operationId: logout
      responses:
        '200':
          description: Refresh token revoked.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                properties:
                  success:
                    type: boolean
                    const: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      security: []
  /auth/me:
    get:
      tags:
        - Auth
      summary: Current profile
      operationId: getMe
      responses:
        '200':
          description: >-
            The authenticated user's profile. Profile update and change-password exist in the service layer but are
            **not routed** — there is no HTTP way to change them today.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/PublicUser'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
      description: >-
        The authenticated user's profile. Profile update and change-password exist in the service layer but are **not
        routed** — there is no HTTP way to change them today.
  /academics/academic-years:
    get:
      tags:
        - Academics
      summary: List academic years
      operationId: listAcademicYears
      responses:
        '200':
          description: >-
            Lists every academic year of the current user, newest first. **Not paginated**: `limit`, `cursor` and
            `status` are validated and then ignored, and the payload is a bare array rather than `{ items, hasMore,
            nextCursor }`. The same router is also mounted at `/academics/years`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AcademicYear'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '429':
          $ref: '#/components/responses/429'
      description: >-
        Lists every academic year of the current user, newest first. **Not paginated**: `limit`, `cursor` and `status`
        are validated and then ignored, and the payload is a bare array rather than `{ items, hasMore, nextCursor }`.
        The same router is also mounted at `/academics/years`.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/YearStatus'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Page size (1-100, default 50).
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
          description: Accepted for compatibility; the list is not paginated (see the description).
