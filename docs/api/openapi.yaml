openapi: 3.1.1
info:
  title: StudentOS API
  version: 0.1.0
  summary: Personal academic operating system for a single student.
  description: >-
    REST API for the StudentOS web client (and any future client). Every path below is relative to the `/api/v1` server
    URL; `GET /health` sits outside `/api/v1` at the application root.


    **Authentication.** Send `Authorization: Bearer <accessToken>` on every endpoint except `POST /auth/register`, `POST
    /auth/login`, `POST /auth/refresh`, `POST /auth/logout` and `GET /health`. Access tokens are HS256 JWTs (default 900
    s) minted by `POST /auth/login`; refresh them with `POST /auth/refresh`, which rotates the stored refresh row
    (default 7 d). A missing or bad token answers 401 with `AUTH_MISSING_TOKEN` / `AUTH_INVALID_TOKEN` /
    `AUTH_TOKEN_EXPIRED`.


    **Envelopes.** Success: `{ success: true, data: T }`. Failure: `{ success: false, error: { code, message, details }
    }` where `details` is **always** present — `[]` when there is nothing to add, a list of `{ path, message, code }`
    for `VALIDATION_ERROR`, and an object for errors that carry context.


    **Ownership.** Every resource belongs to one user and every query filters by that user, so another student's record
    is simply not found: cross-user reads and writes answer **404 `NOT_FOUND`, never 403**. There is no role or
    permission layer in this API.


    **Pagination.** Cursor-based: `limit` (1-100, default 50) plus `cursor` (the id of the last item seen), returning `{
    items, hasMore, nextCursor }`. A few endpoints are deliberately different and say so in their own description:
    academic years, semesters, subtasks, task tags, conversation messages, study-plan entries, `/courses` and
    `/dashboard`.


    **Rate limiting.** `/api/v1` is throttled per client IP (`RATE_LIMIT_MAX_REQUESTS` per `RATE_LIMIT_WINDOW_SECONDS`,
    default 100/60 s). Rejections answer 429 `RATE_LIMITED` with `Retry-After` and `X-RateLimit-*` headers. `GET
    /health` is exempt so probes stay reliable.


    **Errors.** 400 `VALIDATION_ERROR` (Zod, with per-field details), `INVALID_JSON`, `PAYLOAD_TOO_LARGE` (body limit is
    1 MB); 401 `UNAUTHORIZED`; 404 `NOT_FOUND`; 409 `CONFLICT` on duplicate creates and on deleting a course that still
    has data; 500 `INTERNAL_ERROR` with a fixed message in every environment — stacks and Prisma text go to the server
    log under a `req_*` request id only. AI calls can additionally answer 503 `AI_PROVIDER_NOT_CONFIGURED` and 502
    `AI_PROVIDER_ERROR`.


    **Content type.** `application/json` only.
  contact:
    name: StudentOS
    url: https://github.com/elyasdemamu/StudentOS
  license:
    name: MIT
servers:
  - url: /api/v1
    description: Base path for everything except GET /health.
tags:
  - name: Health
    description: Liveness/readiness probe, outside /api/v1
  - name: Auth
    description: Registration, sessions, tokens
  - name: Academics
    description: Academic years and semesters
  - name: Courses
    description: Courses and their cross-system summary
  - name: Dashboard
    description: Single aggregated overview payload
  - name: Tasks
    description: Tasks, subtasks and task tags
  - name: Subtasks
    description: Checklist items nested under a task
  - name: Task Tags
    description: Tags nested under a task
  - name: Notes
    description: Course-linked notes
  - name: Resources
    description: Links and (deferred) file resources
  - name: Events
    description: Calendar events, classes and exams
  - name: Study Sessions
    description: Tracked study time
  - name: Goals
    description: Goals and milestones
  - name: Grades
    description: Grade records
  - name: Notifications
    description: In-app notifications and the reminder sweep
  - name: Settings
    description: Per-user key/value settings
  - name: AI
    description: Assistant conversations, confirmations and study plans
  - name: AI Connections
    description: Per-user provider credentials (write-only)
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from POST /auth/login or POST /auth/refresh.
  responses:
    '400':
      description: Bad request — `VALIDATION_ERROR` (per-field `details`), `INVALID_JSON`, or `PAYLOAD_TOO_LARGE`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    '401':
      description: Missing, invalid or expired credentials — `UNAUTHORIZED` or an `AUTH_*` code.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    '404':
      description: >-
        Not found — including records owned by another user (The record is owner-scoped: someone else's id answers 404,
        never 403.)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    '409':
      description: Conflict — duplicate value or an operation the current state forbids.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    '429':
      description: >-
        Rate limited — `RATE_LIMITED`. `Retry-After` is in seconds; `X-RateLimit-Limit`, `X-RateLimit-Remaining` and
        `X-RateLimit-Reset` describe the window.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the window resets.
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          schema:
            type: integer
          description: Unix seconds when the window resets.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    '500':
      description: '`INTERNAL_ERROR` — the message is fixed in every environment; details are logged, never returned.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    '502':
      description: '`AI_PROVIDER_ERROR` — the model provider answered non-2xx or with an unusable body.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    '503':
      description: '`AI_PROVIDER_NOT_CONFIGURED` — no active connection and no environment default.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    SuccessEnvelope:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          const: true
        data: {}
      description: Every 2xx body except 204 and POST /auth/logout.
    ErrorEnvelope:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          required:
            - code
            - message
            - details
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - INVALID_JSON
                - PAYLOAD_TOO_LARGE
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - DUPLICATE_VALUE
                - RATE_LIMITED
                - INTERNAL_ERROR
                - DATABASE_ERROR
                - FOREIGN_KEY_VIOLATION
                - UPLOAD_STORAGE_UNAVAILABLE
                - AI_PROVIDER_NOT_CONFIGURED
                - AI_PROVIDER_ERROR
                - AUTH_INVALID_TOKEN
                - AUTH_TOKEN_EXPIRED
                - AUTH_MISSING_TOKEN
                - AUTH_TOKEN_REVOKED
              description: Machine-readable error code. Auth codes come from the bearer guard.
            message:
              type: string
            details:
              description: >-
                Always present. `[]` when there is nothing to add; a list of { path, message, code } entries for
                VALIDATION_ERROR; an object for errors that carry context.
              oneOf:
                - type: array
                  items:
                    type: object
                    required:
                      - path
                      - message
                    properties:
                      path:
                        type: string
                      message:
                        type: string
                      code:
                        type: string
                - type: object
    YearStatus:
      type: string
      enum:
        - UPCOMING
        - ACTIVE
        - COMPLETED
    CourseStatus:
      type: string
      enum:
        - ACTIVE
        - COMPLETED
        - DROPPED
    TaskStatus:
      type: string
      enum:
        - TODO
        - IN_PROGRESS
        - COMPLETED
        - CANCELLED
    TaskPriority:
      type: string
      enum:
        - LOW
        - MEDIUM
        - HIGH
        - URGENT
    TaskType:
      type: string
      enum:
        - ASSIGNMENT
        - HOMEWORK
        - PROJECT
        - READING
        - PRACTICE
        - REVISION
        - OTHER
    EventType:
      type: string
      enum:
        - CLASS
        - EXAM
        - ASSIGNMENT
        - PROJECT
        - STUDY
        - MEETING
        - PERSONAL
        - OTHER
    ResourceType:
      type: string
      enum:
        - PDF
        - VIDEO
        - AUDIO
        - SLIDES
        - LINK
        - DOCUMENT
        - OTHER
    ResourceStorageType:
      type: string
      enum:
        - URL
        - UPLOAD
    GoalStatus:
      type: string
      enum:
        - ACTIVE
        - COMPLETED
        - CANCELLED
    MilestoneStatus:
      type: string
      enum:
        - TODO
        - IN_PROGRESS
        - COMPLETED
    GradeType:
      type: string
      enum:
        - ASSIGNMENT
        - EXAM
        - QUIZ
        - PROJECT
        - PARTICIPATION
        - FINAL
        - OTHER
        - ASSESSMENT
    NotificationStatus:
      type: string
      enum:
        - UNREAD
        - READ
        - ARCHIVED
    NotificationType:
      type: string
      enum:
        - ASSIGNMENT_DUE
        - EXAM_REMINDER
        - OVERDUE_TASK
        - STUDY_REMINDER
        - STUDY_PLAN_REMINDER
        - GOAL_REMINDER
        - GENERAL
    NotificationDelivery:
      type: string
      enum:
        - IN_APP
        - PUSH
        - EMAIL
        - SMS
        - TELEGRAM
    ConversationType:
      type: string
      enum:
        - CHAT
        - TUTOR
        - QUIZ
        - STUDY_PLAN
        - EXPLAIN
    AiMessageRole:
      type: string
      enum:
        - USER
        - ASSISTANT
        - SYSTEM
    StudyPlanEntryStatus:
      type: string
      enum:
        - PENDING
        - IN_PROGRESS
        - COMPLETED
        - SKIPPED
    AiProvider:
      type: string
      enum:
        - openai
        - gemini
        - anthropic
        - openrouter
        - ollama
        - custom
    PendingActionStatus:
      type: string
      enum:
        - PENDING
        - EXECUTED
        - CANCELLED
        - SUPERSEDED
    PublicUser:
      type: object
      required:
        - id
        - email
        - firstName
        - lastName
        - createdAt
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        university:
          type:
            - string
            - 'null'
        department:
          type:
            - string
            - 'null'
        academicYear:
          type:
            - string
            - 'null'
        timezone:
          type:
            - string
            - 'null'
        profilePicture:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp
      description: Never contains the password hash.
    TokenPair:
      type: object
      required:
        - accessToken
        - refreshToken
        - expiresIn
        - user
      properties:
        accessToken:
          type: string
          description: 'HS256 JWT, 900 s default, claims { sub, email, type: ''access'' }'
        refreshToken:
          type: string
          description: HS256 JWT, 7 d default; the row in RefreshToken is what actually expires it
        expiresIn:
          type: integer
          description: Access-token lifetime in seconds
        user:
          $ref: '#/components/schemas/PublicUser'
    AcademicYear:
      type: object
      required:
        - id
        - name
        - startDate
        - endDate
        - status
      properties:
        id:
          type: string
        name:
          type: string
        startDate:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: YYYY-MM-DD
        endDate:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: YYYY-MM-DD
        status:
          $ref: '#/components/schemas/YearStatus'
        createdAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp
        updatedAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp
    Semester:
      type: object
      required:
        - id
        - academicYearId
        - name
        - startDate
        - endDate
        - status
      properties:
        id:
          type: string
        academicYearId:
          type: string
        name:
          type: string
        startDate:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: YYYY-MM-DD
        endDate:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: YYYY-MM-DD
        status:
          $ref: '#/components/schemas/YearStatus'
        createdAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp
        updatedAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp
    Course:
      type: object
      required:
        - id
        - code
        - name
        - credits
        - description
        - instructor
        - semesterId
        - status
        - createdAt
        - updatedAt
        - semester
      properties:
        id:
          type: string
        code:
          type:
            - string
            - 'null'
          maxLength: 20
          pattern: ^[A-Za-z0-9][A-Za-z0-9\s\-.]*
        name:
          type: string
        credits:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 50
        description:
          type:
            - string
            - 'null'
        instructor:
          type:
            - string
            - 'null'
        semesterId:
          type:
            - string
            - 'null'
        status:
          $ref: '#/components/schemas/CourseStatus'
        createdAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp
        updatedAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp
        semester:
          type:
            - object
            - 'null'
          properties:
            id:
              type: string
            name:
              type: string
            startDate:
              type: string
              pattern: ^\d{4}-\d{2}-\d{2}$
              description: YYYY-MM-DD
            endDate:
              type: string
              pattern: ^\d{4}-\d{2}-\d{2}$
              description: YYYY-MM-DD
            status:
              $ref: '#/components/schemas/YearStatus'
            academicYear:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                startDate:
                  type: string
                  pattern: ^\d{4}-\d{2}-\d{2}$
                  description: YYYY-MM-DD
                endDate:
                  type: string
                  pattern: ^\d{4}-\d{2}-\d{2}$
                  description: YYYY-MM-DD
                status:
                  $ref: '#/components/schemas/YearStatus'
    CourseSummary:
      type: object
      required:
        - course
        - tasks
        - events
        - nextExam
        - notes
        - resources
        - grades
        - study
        - goals
        - eventsToday
      properties:
        course:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            code:
              type:
                - string
                - 'null'
            status:
              $ref: '#/components/schemas/CourseStatus'
            credits:
              type:
                - integer
                - 'null'
            semesterId:
              type:
                - string
                - 'null'
        tasks:
          type: object
          properties:
            total:
              type: integer
            completed:
              type: integer
            open:
              type: integer
            overdue:
              type: integer
            progress:
              type:
                - number
                - 'null'
            byStatus:
              type: object
              additionalProperties:
                type: integer
        events:
          type: object
          properties:
            upcoming:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  type:
                    $ref: '#/components/schemas/EventType'
                  startAt:
                    type: string
                    format: date-time
                    description: ISO-8601 timestamp
                  endAt:
                    type:
                      - string
                      - 'null'
                  location:
                    type:
                      - string
                      - 'null'
            examCount:
              type: integer
        nextExam:
          type:
            - object
            - 'null'
          properties:
            id:
              type: string
            title:
              type: string
            startAt:
              type: string
              format: date-time
              description: ISO-8601 timestamp
            location:
              type:
                - string
                - 'null'
        notes:
          type: object
          properties:
            total:
              type: integer
        resources:
          type: object
          properties:
            total:
              type: integer
        grades:
          type: object
          properties:
            total:
              type: integer
            scored:
              type: integer
            average:
              type:
                - number
                - 'null'
            recent:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  score:
                    type:
                      - number
                      - 'null'
                  maxScore:
                    type:
                      - number
                      - 'null'
                  weight:
                    type:
                      - number
                      - 'null'
                  type:
                    $ref: '#/components/schemas/GradeType'
                  recordedAt:
                    type: string
                    format: date-time
                    description: ISO-8601 timestamp
        study:
          type: object
          properties:
            sessions:
              type: integer
            totalMinutes:
              type: integer
        goals:
          type: object
          properties:
            relatedActive:
              type: integer
        eventsToday:
          type: integer
    Task:
      type: object
      required:
        - id
        - title
        - type
        - priority
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        courseId:
          type:
            - string
            - 'null'
        title:
          type: string
          maxLength: 200
        description:
          type:
            - string
            - 'null'
        type:
          $ref: '#/components/schemas/TaskType'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        status:
          $ref: '#/components/schemas/TaskStatus'
        dueDate:
          type:
            - string
            - 'null'
          format: date-time
        estimatedMinutes:
          type:
            - integer
            - 'null'
        completedAt:
          type:
            - string
            - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp
        updatedAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp
        course:
          type:
            - object
            - 'null'
          properties:
            id:
              type: string
            code:
              type:
                - string
                - 'null'
            name:
              type: string
    Subtask:
      type: object
      required:
        - id
        - taskId
        - title
        - status
        - position
      properties:
        id:
          type: string
        taskId:
          type: string
        title:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        position:
          type: integer
        completedAt:
          type:
            - string
            - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp
        updatedAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp
    TaskTag:
      type: object
      required:
        - id
        - taskId
        - name
      properties:
        id:
          type: string
        taskId:
          type: string
        name:
          type: string
        color:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp
    Note:
      type: object
      required:
        - id
        - title
        - content
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        courseId:
          type:
            - string
            - 'null'
        title:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp
        updatedAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp
        course:
          type:
            - object
            - 'null'
          properties:
            id:
              type: string
            code:
              type:
                - string
                - 'null'
            name:
              type: string
    Resource:
      type: object
      required:
        - id
        - title
        - storageType
        - resourceType
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        courseId:
          type:
            - string
            - 'null'
        title:
          type: string
        description:
          type:
            - string
            - 'null'
        url:
          type:
            - string
            - 'null'
          format: uri
        storageType:
          $ref: '#/components/schemas/ResourceStorageType'
        fileKey:
          type:
            - string
            - 'null'
        fileName:
          type:
            - string
            - 'null'
        fileSize:
          type:
            - integer
            - 'null'
        mimeType:
          type:
            - string
            - 'null'
        resourceType:
          $ref: '#/components/schemas/ResourceType'
        createdAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp
        updatedAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp
        course:
          type:
            - object
            - 'null'
          properties:
            id:
              type: string
            code:
              type:
                - string
                - 'null'
            name:
              type: string
      description: UPLOAD storage exists in the model but is rejected with UPLOAD_STORAGE_UNAVAILABLE until S3 lands.
    CalEvent:
      type: object
      required:
        - id
        - title
        - type
        - startAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        courseId:
          type:
            - string
            - 'null'
        title:
          type: string
        description:
          type:
            - string
            - 'null'
        type:
          $ref: '#/components/schemas/EventType'
        startAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp
        endAt:
          type:
            - string
            - 'null'
          format: date-time
        location:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp
        updatedAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp
        course:
          type:
            - object
            - 'null'
          properties:
            id:
              type: string
            code:
              type:
                - string
                - 'null'
            name:
              type: string
    StudySession:
      type: object
      required:
        - id
        - startedAt
        - createdAt
      properties:
        id:
          type: string
        courseId:
          type:
            - string
            - 'null'
        taskId:
          type:
            - string
            - 'null'
        topic:
          type:
            - string
            - 'null'
        startedAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp
        endedAt:
          type:
            - string
            - 'null'
          format: date-time
        durationMinutes:
          type:
            - integer
            - 'null'
        focusRating:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 5
        createdAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp
        course:
          type:
            - object
            - 'null'
          properties:
            id:
              type: string
            code:
              type:
                - string
                - 'null'
            name:
              type: string
    GoalMilestone:
      type: object
      required:
        - id
        - goalId
        - title
        - status
