                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/AcademicYear'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '409':
          $ref: '#/components/responses/409'
        '429':
          $ref: '#/components/responses/429'
      description: startDate must be before endDate (400) and the name must be unique per user (409).
      requestBody:
        required: true
        content:
          application/json:
