name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studentos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @tutor-walle/api exec prisma generate
      - name: Create database schema
        run: pnpm --filter @tutor-walle/api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studentos_test?schema=public
      - name: Run API tests
        run: pnpm --filter @tutor-walle/api test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studentos_test?schema=public
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studentos_test?schema=public
          JWT_SECRET: test-secret
          ENCRYPTION_KEY: test-encryption-key-32-chars-long!!
      - name: Typecheck API
        run: pnpm --filter @tutor-walle/api exec tsc --noEmit
      - name: Build API
        run: pnpm --filter @tutor-walle/api build
      - name: Build production API container
        run: docker build --target api -t tutor-walle-api:ci .
      - name: Build restricted egress gateway container
        run: docker build --target egress -t tutor-walle-egress:ci .

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run web tests
        run: pnpm --filter @tutor-walle/web test
      - name: Typecheck web
        run: pnpm --filter @tutor-walle/web exec tsc --noEmit
      - name: Lint web
        run: pnpm --filter @tutor-walle/web lint
      - name: Build web
        run: pnpm --filter @tutor-walle/web build
      - name: Build production web container
        run: docker build -f frontend/Dockerfile --build-arg NEXT_PUBLIC_API_URL=https://example.invalid/api/v1 -t tutor-walle-web:ci .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: render.yaml has no localhost URLs and keeps secrets dashboard-managed
        run: |
          set -euo pipefail
          if grep -nE 'localhost|127\.0\.0\.1' render.yaml; then
            echo "::error::render.yaml must not reference localhost"; exit 1
          fi
          awk '
            /^[[:space:]]*-[[:space:]]*key:[[:space:]]*(DATABASE_URL|JWT_SECRET|ENCRYPTION_KEY|EGRESS_DATABASE_HOST|EGRESS_ALLOWED_DESTINATIONS|OPENROUTER_API_KEY|GOOGLE_CLIENT_ID|NEXT_PUBLIC_GOOGLE_CLIENT_ID)[[:space:]]*$/ { want=1; next }
            want==1 && /^[[:space:]]*sync:[[:space:]]*false/ { want=0; next }
            want==1 && !/^[[:space:]]*$/ { printf "secret key on line %d is not sync:false: %s\n", NR, $0; bad=1; want=0 }
            END { exit bad }
          ' render.yaml
      - name: Validate render.yaml against Render's published Blueprint schema
        run: |
          set -euo pipefail
          npx --yes js-yaml@4.1.0 render.yaml > "$RUNNER_TEMP/render-yaml.json"
          curl -fsSL https://render.com/schema/render.yaml.json -o "$RUNNER_TEMP/render-yaml-schema.json"
          npx --yes ajv-cli@5 validate --spec=draft2020 --strict=false \
            -s "$RUNNER_TEMP/render-yaml-schema.json" \
            -d "$RUNNER_TEMP/render-yaml.json"
      - name: Every migration directory carries its SQL
        run: |
          set -euo pipefail
          for dir in backend/prisma/migrations/*/; do
            if [ ! -f "$dir/migration.sql" ]; then echo "missing migration.sql in $dir"; exit 1; fi
          done
